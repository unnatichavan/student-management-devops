<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <!-- Bootstrap CSS for professional styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .container { max-width: 600px; margin-top: 50px; }
        .card { box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .delete-btn { text-decoration: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="card-header bg-primary text-white text-center">
            <h3 class="mb-0">🎓 Student Management System</h3>
        </div>
        <div class="card-body">
            
            <!-- Add Student Form -->
            <form action="/add" method="POST" class="mb-4">
                <div class="input-group">
                    <input type="text" name="name" class="form-control" placeholder="Enter student name" required>
                    <button type="submit" class="btn btn-success">Add Student</button>
                </div>
            </form>

            <!-- Student List -->
            <h5 class="mb-3">Registered Students</h5>
            
            {% if students %}
                <ul class="list-group">
                    {% for student in students %}
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        <span>{{ student }}</span>
                        <a href="/delete/{{ loop.index0 }}" class="btn btn-sm btn-danger delete-btn">Delete</a>
                    </li>
                    {% endfor %}
                </ul>
            {% else %}
                <div class="alert alert-info text-center" role="alert">
                    No students added yet. Add your first student above!
                </div>
            {% endif %}

        </div>
        <div class="card-footer text-muted text-center">
            DevOps Mini-Project | Powered by Jenkins & Docker
        </div>
    </div>
</div>

<!-- Bootstrap JS (Optional, for animations) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
